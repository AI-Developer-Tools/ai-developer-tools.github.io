site_name: "CMU 17-316/616: AI Tools for Software Development"

theme:
  name: material
  custom_dir: overrides
  logo:
  favicon: assets/favicon.ico
  font:
    text: Roboto
  palette:
    - scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - announce.dismiss

markdown_extensions:
  - attr_list
  - pymdownx.emoji:
        emoji_index: !!python/name:material.extensions.emoji.twemoji
        emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      clickable_checkbox: true
      custom_checkbox: true
  - tables
  - toc:
      title: On This Page
      toc_depth: 4
      permalink: true

extra_css:
  - stylesheets/custom.css

plugins:
  - search
  - markdownextradata

nav:
  - Home: index.md
  - Overview: overview.md
  - Syllabus: syllabus.md
  - Teamwork Practices: teamwork.md
  - Staff: staff.md
  - Assignments:  # assignments/index.md # Dummy home page; remove once we start adding assignments below
      - Reflection 1: assignments/HW1.md
      - Reflection 2: assignments/HW2.md
      - Reflection 3: assignments/HW3.md
      - Reflection 4: assignments/HW4.md
      - Reflection 5: assignments/HW5.md
      - Reflection 6: assignments/HW6.md
  - Project: 
      - Project 1 Requirements Engineering: project/p1.md
      - Project 2 Development Specifications: project/p2.md
      - Project 3 Frontend Development: project/p3.md
      - Project 4 Backend Development: project/p4.md
      - Project 5 Testing: project/p5.md
